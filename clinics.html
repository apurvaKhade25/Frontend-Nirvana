<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nirvana — Find Clinics</title>

<link rel="stylesheet" href="css/style.css"/>

<!-- 🌍 Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
/* 🔥 EXTRA UI IMPROVEMENT */
.page-hero {
  background: linear-gradient(135deg, #4fd1c5, #6b73ff);
  color: white;
  padding: 25px;
  border-radius: 16px;
}

#map {
  height: 320px;
  border-radius: 16px;
}

.clinic-card:hover {
  transform: translateY(-3px);
  transition: 0.2s;
}
</style>

</head>

<body>

<div id="toast-container"></div>

<div class="page-wrapper">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <span class="logo-text">Nirvana</span>
    <span class="logo-sub">Wellness</span>
  </div>

  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sidebar-avatar">?</div>
    <div>
      <div class="sidebar-user-name" id="sidebar-name">Loading...</div>
      <div class="sidebar-user-tag">✦ Wellness member</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
    <a href="mood.html" class="nav-item">😊 Mood</a>
    <a href="journal.html" class="nav-item">📓 Journal</a>
    <a href="chat.html" class="nav-item">🤖 AI</a>
    <a href="report.html" class="nav-item">📊 Report</a>
    <a href="clinics.html" class="nav-item active">🏥 Clinics</a>
  </nav>

  <div class="sidebar-footer">
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main-content">

<div class="topbar">
  <h2>Find Nearby Clinics 🏥</h2>
</div>

<!-- HERO -->
<div class="page-hero">
  <h2>You are not alone 🌿</h2>
  <p>Find mental health support near you instantly.</p>
</div>

<br>

<!-- LOCATION BUTTON -->
<div class="card">
  <button class="btn btn-primary" onclick="getLocation()">
    📍 Use My Location
  </button>
</div>

<br>

<!-- MAP -->
<div class="card">
  <div id="map"></div>
</div>

<br>

<!-- CLINICS -->
<div id="clinics-area"></div>

</main>
</div>

<!-- 🌍 Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const token = localStorage.getItem('nirvana_token');

if (!token) {
  alert("Login first");
}

let map;

/* 🚀 MAP FUNCTION */
function loadMap(lat, lng) {
  map = L.map('map').setView([lat, lng], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  L.marker([lat, lng]).addTo(map)
    .bindPopup("📍 You are here")
    .openPopup();
}

/* 📍 LOCATION */
function getLocation() {
  navigator.geolocation.getCurrentPosition((pos) => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    loadMap(lat, lng);

    showClinics();

  }, () => {
    alert("Location not allowed");
  });
}

/* 🏥 DEMO CLINICS */
function showClinics() {
  const clinics = [
    { name: "MindCare Clinic", address: "Pune", rating: 4.8 },
    { name: "Wellness Center", address: "Mumbai", rating: 4.6 },
    { name: "Healing Minds", address: "Delhi", rating: 4.7 }
  ];

  let html = "";

  clinics.forEach(c => {
    html += `
      <div class="card clinic-card">
        <h3>🏥 ${c.name}</h3>
        <p>📍 ${c.address}</p>
        <p>⭐ ${c.rating}</p>
      </div>
      <br>
    `;
  });

  document.getElementById("clinics-area").innerHTML = html;
}

/* 🚪 LOGOUT */
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

</script>

</body>
</html>
